[package]
name = "wallet-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# std-only, no simd-unsafe: this crate has no performance need for
# vectorized base64 (share blobs are tiny), and every other dependency
# choice in this workspace deliberately minimizes unsafe surface area.
base64 = { version = "0.23", default-features = false, features = ["std"] }
wallet-core = { path = "../wallet-core" }
wallet-rpc = { path = "../wallet-rpc" }
wallet-storage = { path = "../wallet-storage" }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
