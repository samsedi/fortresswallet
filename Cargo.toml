[workspace]
resolver = "3"
members = [
    "crates/wallet-crypto",
    "crates/wallet-core",
    "crates/wallet-storage",
    "crates/wallet-decoder",
    "crates/wallet-rpc",
    "crates/wallet-cli", "crates/wallet-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# None of these are meant to be published to crates.io as standalone
# crates — they're internal implementation crates of one wallet binary.
publish = false

# Rust silently wraps integer arithmetic in release builds by default —
# every u128/u64/usize computation in this workspace (transaction values,
# offsets, share indices, ...) would wrap instead of panicking under
# `cargo build --release` without this. Debug builds already panic on
# overflow; this makes release match, at a small perf cost this project
# accepts for the safety.
[profile.release]
overflow-checks = true

# Every crate that touches key material inherits these lints as errors,
# not warnings, so an unsafe-in-the-wrong-place slip fails the build.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"        # promote to "deny" once crate APIs stabilize
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }  # promote to "deny" once stable
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
