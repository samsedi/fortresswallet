name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets so lints also cover test code, not just lib/bin
      # sources — several of the fixes already made in this repo (missing
      # docs, doc-comment formatting) were caught by linting test files.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo-deny (supply chain / license / advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  boundaries:
    name: Dependency boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check_boundaries.sh

  release:
    name: Release profile (overflow-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `test` job above runs in the debug profile, which already
      # panics on integer overflow regardless of Cargo.toml — it can
      # never catch a regression to [profile.release]'s
      # `overflow-checks = true`, and it never even compiles the release
      # profile. This job is what actually exercises both: if someone
      # deletes overflow-checks, or a release-only cfg breaks, this is
      # the job that goes red.
      - run: cargo test --workspace --release
