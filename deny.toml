# Schema for cargo-deny 0.20.x. The `[advisories]` fields `vulnerability`,
# `unmaintained`, `yanked`, `notice` and the `[licenses]` fields
# `unlicensed`/`copyleft` from older cargo-deny versions were removed
# (see https://github.com/EmbarkStudios/cargo-deny/pull/611) — vulnerable
# and yanked crates are hard-denied by default now, with exceptions listed
# under `advisories.ignore`; unlicensed/copyleft crates are implicitly
# denied because only what's in `licenses.allow` passes.
[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates aren't published (all set publish = false in
# Cargo.toml); don't require them to declare a license.
ignore = true

[bans]
multiple-versions = "warn"   # Flag duplicate crate versions
wildcards = "deny"           # No wildcard version specs
# Workspace-internal path deps (wallet-core -> wallet-crypto, etc.) are
# exempt now that every crate sets publish = false — cargo-deny only
# grants this exemption to unpublishable crates, so it doesn't relax the
# check for any external dependency.
allow-wildcard-paths = true

# Explicitly ban crates that are known footguns in crypto contexts
deny = [
    { crate = "rust-crypto", reason = "old, unmaintained crate; do not use" },
    { crate = "ring", reason = "workspace standardizes on RustCrypto (k256/aead); don't mix crypto libraries" },
    { crate = "openssl", reason = "pure Rust crypto only, no C FFI" },
    { crate = "openssl-sys", reason = "pure Rust crypto only, no C FFI" },
]

[sources]
unknown-registry = "deny"    # Only crates.io
unknown-git = "deny"         # No random git dependencies
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []               # No git deps allowed
